<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KFUPMYNL | المنصة الأكاديمية المتكاملة</title>
<style>
:root {
  --bg-dark: #070b19;
  --panel-dark: #111827;
  --text-dark: #f9fafb;
  --muted-dark: #9ca3af;
  --border-dark: rgba(255, 255, 255, 0.08);

  --bg-light: #f3f4f6;
  --panel-light: #ffffff;
  --text-light: #111827;
  --muted-light: #4b5563;
  --border-light: rgba(0, 0, 0, 0.08);

  --accent: #6366f1;
  --cyan: #06b6d4;
  --success: #10b981;
  --danger: #ef4444;
  --shadow: 0 10px 30px rgba(0,0,0,0.2);
}

body.dark-mode {
  --bg: var(--bg-dark);
  --panel: var(--panel-dark);
  --text: var(--text-dark);
  --muted: var(--muted-dark);
  --border: var(--border-dark);
}

body.light-mode {
  --bg: var(--bg-light);
  --panel: var(--panel-light);
  --text: var(--text-light);
  --muted: var(--muted-light);
  --border: var(--border-light);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  line-height: 1.8;
  transition: background 0.3s, color 0.3s;
  min-height: 100vh;
}
.shell { max-width: 1200px; margin: auto; padding: 0 20px; }

header {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
}
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 80px;
}
.logo { font-weight: 900; font-size: 1.4rem; color: var(--cyan); }
.nav-btns { display: flex; gap: 5px; flex-wrap: wrap; }
.nav-btns button {
  background: transparent;
  border: none;
  color: var(--muted);
  font-weight: 700;
  cursor: pointer;
  padding: 8px 14px;
  border-radius: 10px;
  transition: 0.2s;
}
.nav-btns button:hover, .nav-btns button.active {
  background: rgba(99,102,241,0.15);
  color: var(--accent);
}
.ctrl-box { display: flex; gap: 10px; align-items: center; }
.ctrl-btn {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.main-container { padding: 40px 0; }
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 30px;
  margin-bottom: 30px;
  box-shadow: var(--shadow);
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, var(--accent), var(--cyan));
  color: #fff;
  padding: 12px 24px;
  border-radius: 12px;
  font-weight: 800;
  text-decoration: none;
  border: none;
  cursor: pointer;
  transition: transform 0.2s;
}
.btn:hover { transform: translateY(-2px); }
.pdf-frame { width: 100%; height: 700px; border: 1px solid var(--border); border-radius: 16px; background: #fff; margin-top: 15px; }

.grid-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  margin-top: 20px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 24px;
  cursor: pointer;
  transition: 0.25s;
}
.card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: var(--shadow); }
.card h3 { margin-top: 0; color: var(--cyan); }

/* نظام بطاقات الشرح والتفاصيل للملفات */
.concepts-title { font-size: 1.2rem; font-weight: 800; color: var(--cyan); margin: 30px 0 15px; }
.concept-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 15px; }
.concept-tab {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 14px;
  border-radius: 12px;
  font-weight: 700;
  text-align: right;
  cursor: pointer;
  transition: 0.2s;
}
.concept-tab span { display: block; font-size: 0.75rem; color: var(--muted); font-weight: normal; margin-top: 3px; }
.concept-tab.active, .concept-tab:hover { border-color: var(--accent); background: rgba(99,102,241,0.1); color: var(--accent); }
.concept-box {
  background: var(--bg);
  border: 1px solid var(--accent);
  border-radius: 14px;
  padding: 20px;
  margin-top: 10px;
}
.math-block {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--cyan);
  font-family: monospace;
  padding: 10px 15px;
  border-radius: 8px;
  margin: 10px 0;
  direction: ltr;
  text-align: center;
  font-weight: bold;
}

/* اختبارات المهارات */
.q-card { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 15px; }
.opts-grid { display: grid; gap: 8px; margin-top: 10px; }
.opt-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; text-align: right; cursor: pointer; }
.opt-btn:hover { border-color: var(--accent); }
.opt-btn.selected { background: rgba(99,102,241,0.3); border-color: var(--accent); font-weight: bold; }
.opt-btn.correct { background: rgba(16,185,129,0.3); border-color: var(--success); color: #a7f3d0; }
.opt-btn.wrong { background: rgba(239,68,68,0.3); border-color: var(--danger); color: #fecdd3; }

footer { background: var(--panel); border-top: 1px solid var(--border); padding: 40px 0; text-align: center; margin-top: 60px; }
.telegram-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: #24A1DE;
  color: #fff;
  padding: 14px 28px;
  border-radius: 14px;
  font-weight: 900;
  text-decoration: none;
  margin: 15px 0;
  box-shadow: 0 10px 20px rgba(36,161,222,0.3);
}
</style>
</head>

}

  document.querySelectorAll('.nav-btns button').forEach(b => {
    b.classList.toggle('active', b.dataset.target === page);

// شروح الحسابات وبطاقات البكرات

// اختبارات المهارات الـ 85 المصغرة للتشغيل الفوري
const skillQuests = [
  [
    {q: "1- أي من المصادر التالية يعتبر الأكثر موضوعية ودقة عند البحث عن العلاقة بين السمنة والمشروبات الغازية؟", opts: ["استبيانات شركات المشروبات", "دورية علمية محكمة في التغذية", "دراسة متطوعين غير متخصصين", "تقرير وزارة النقل"], ans: 1},
    {q: "2- الروابط الإلكترونية التي تنتهي بـ gov تتبع لجهات:", opts: ["حكومية", "تعليمية", "تجارية", "غير ربحية"], ans: 0}
  ],
  [
    {q: "1- اختصار لوحة المفاتيح لتغيير لغة الكتابة في النظام هو:", opts: ["Ctrl + Shift", "Alt + Shift", "Win + Alt", "Ctrl + Alt"], ans: 1},
    {q: "2- امتداد الملفات الخاص ببرنامج الجداول الحسابية Excel هو:", opts: ["docx", "xlsx", "pptx", "jpg"], ans: 1}
  ]
];

let userAns = {};
function loadSkillQuiz(qIdx) {
  let items = skillQuests[qIdx] || skillQuests[0];
  let html = `<div class="panel"><h3>اختبار المهارات التفاعلي ${qIdx+1}</h3><div id="skScore" style="font-weight:bold; color:var(--cyan); margin-bottom:15px;"></div>`;
  items.forEach((item, i) => {
    html += `<div class="q-card" id="qcard-${qIdx}-${i}"><div style="font-weight:bold; margin-bottom:10px;">${item.q}</div><div class="opts-grid">`;
    item.opts.forEach((opt, o) => {
      html += `<button class="opt-btn" onclick="selectOpt(${qIdx}, ${i}, ${o}, this)">${opt}</button>`;
    });
    html += `</div></div>`;
  });
  html += `<button class="btn" style="width:100%; margin-top:15px;" onclick="checkSkill(${qIdx})">تصحيح الاختبار</button></div>`;
  document.getElementById('skillQuizHost').innerHTML = html;
}

function selectOpt(qIdx, i, o, btn) {
  if(!userAns[qIdx]) userAns[qIdx] = {};
  userAns[qIdx][i] = o;
  btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function checkSkill(qIdx) {
  let items = skillQuests[qIdx] || skillQuests[0];
  let score = 0;
  items.forEach((item, i) => {
    let card = document.getElementById(`qcard-${qIdx}-${i}`);
    let btns = card.querySelectorAll('.opt-btn');
    let u = userAns[qIdx] ? userAns[qIdx][i] : undefined;
    btns.forEach((b, o) => {
      if(o === item.ans) b.classList.add('correct');
      else if(o === u) b.classList.add('wrong');
    });
    if(u === item.ans) score++;
  });
  document.getElementById('skScore').textContent = `النتيجة: ${score} من ${items.length}`;
}
