<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b19">
<title>KFUPMYNL | المنصة الأكاديمية المتكاملة</title>
<style>
:root {
  --bg-dark: #070b19;
  --panel-dark: rgba(17, 24, 39, 0.85);
  --panel2-dark: #111827;
  --text-dark: #f9fafb;
  --muted-dark: #9ca3af;
  --border-dark: rgba(255, 255, 255, 0.08);

  --bg-light: #f3f4f6;
  --panel-light: rgba(255, 255, 255, 0.95);
  --panel2-light: #ffffff;
  --text-light: #111827;
  --muted-light: #4b5563;
  --border-light: rgba(0, 0, 0, 0.08);

  --accent: #6366f1;
  --accent-glow: rgba(99, 102, 241, 0.35);
  --cyan: #06b6d4;
  --pink: #ec4899;
  --success: #10b981;
  --danger: #ef4444;
  --shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
}

body.dark-mode {
  --bg: var(--bg-dark);
  --panel: var(--panel-dark);
  --panel2: var(--panel2-dark);
  --text: var(--text-dark);
  --muted: var(--muted-dark);
  --border: var(--border-dark);
}

body.light-mode {
  --bg: var(--bg-light);
  --panel: var(--panel-light);
  --panel2: var(--panel2-light);
  --text: var(--text-light);
  --muted: var(--muted-light);
  --border: var(--border-light);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  line-height: 1.8;
  min-height: 100vh;
  transition: background 0.3s ease, color 0.3s ease;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
.shell { max-width: 1200px; margin: auto; padding: 0 20px; }

.header-container {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--panel);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 85px;
}
.brand-box {
  display: flex;
  align-items: center;
  gap: 12px;
  direction: ltr;
  font-weight: 900;
  font-size: 1.4rem;
  background: linear-gradient(135deg, var(--accent), var(--cyan));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.brand-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, var(--accent), var(--pink));
  color: #fff;
  display: grid;
  place-items: center;
  border-radius: 12px;
  font-weight: bold;
  box-shadow: 0 4px 15px var(--accent-glow);
}
.nav-links {
  display: flex;
  gap: 6px;
}
.nav-links button {
  background: transparent;
  color: var(--muted);
  border: none;
  padding: 10px 16px;
  border-radius: 12px;
  font-weight: 700;
  transition: all 0.25s;
}
.nav-links button:hover, .nav-links button.active {
  background: rgba(99, 102, 241, 0.15);
  color: var(--accent);
}
.nav-controls {
  display: flex;
  gap: 10px;
}
.ctrl-btn {
  background: var(--panel2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}
.mobile-btn { display: none; background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 10px; }

.hero-wrapper {
  padding: 70px 0 50px;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  align-items: center;
  gap: 40px;
}
.hero-badge {
  display: inline-block;
  background: rgba(6, 182, 212, 0.1);
  color: var(--cyan);
  border: 1px solid rgba(6, 182, 212, 0.3);
  padding: 6px 16px;
  border-radius: 30px;
  font-size: 0.9rem;
  font-weight: 800;
  margin-bottom: 20px;
}
.hero-title {
  font-size: clamp(2.5rem, 4.5vw, 4rem);
  line-height: 1.15;
  font-weight: 900;
  margin: 0 0 20px;
}
.hero-title span {
  background: linear-gradient(120deg, var(--accent), var(--cyan), var(--pink));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero-subtitle {
  font-size: 1.15rem;
  color: var(--muted);
  margin-bottom: 30px;
  max-width: 550px;
}
.hero-actions {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}
.action-btn {
  padding: 14px 26px;
  border-radius: 14px;
  font-weight: 800;
  border: none;
  transition: transform 0.2s, box-shadow 0.2s;
}
.action-btn:hover { transform: translateY(-3px); }
.action-btn.primary {
  background: linear-gradient(135deg, var(--accent), var(--cyan));
  color: #fff;
  box-shadow: 0 10px 25px var(--accent-glow);
}
.action-btn.secondary {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
}

.hero-box-art {
  background: linear-gradient(145deg, rgba(99, 102, 241, 0.1), rgba(6, 182, 212, 0.05));
  border: 1px solid var(--border);
  border-radius: 30px;
  padding: 45px;
  text-align: center;
  box-shadow: var(--shadow);
}
.hero-box-art h3 { font-size: 1.8rem; margin: 0 0 10px; font-weight: 900; }
.hero-box-art p { color: var(--muted); margin: 0; }

.grid-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
  padding: 40px 0 70px;
}
.card-item {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 28px;
  position: relative;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}
.card-item:hover {
  transform: translateY(-6px);
  border-color: var(--accent);
  box-shadow: var(--shadow);
}
.card-icon-box {
  width: 55px; height: 55px;
  background: rgba(99, 102, 241, 0.12);
  color: var(--accent);
  border-radius: 16px;
  display: grid;
  place-items: center;
  font-size: 1.6rem;
  margin-bottom: 20px;
}
.card-item h3 { font-size: 1.35rem; margin: 0 0 8px; font-weight: 800; }
.card-item p { color: var(--muted); margin: 0 0 18px; font-size: 0.94rem; }
.card-action-link { color: var(--accent); font-weight: 800; font-size: 0.95rem; }

.back-link { background: transparent; border: none; color: var(--accent); font-weight: 800; font-size: 1.05rem; padding: 10px 0; margin-bottom: 20px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.section-header { margin-bottom: 25px; }
.section-header h1 { font-size: 2.4rem; font-weight: 900; margin: 5px 0 10px; }
.section-header p { color: var(--muted); font-size: 1.05rem; max-width: 750px; }

.main-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 32px;
  margin-bottom: 30px;
  box-shadow: var(--shadow);
}
.pdf-download-bar {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.pdf-download-bar h4 { margin: 0 0 4px; font-size: 1.15rem; }
.pdf-download-bar p { margin: 0; color: var(--muted); font-size: 0.9rem; }

.pdf-viewer, .quiz-iframe {
  width: 100%;
  height: 80vh;
  min-height: 700px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: #fff;
}
.quiz-iframe { background: #0b0f19; }

.concepts-section-title {
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--cyan);
  margin: 30px 0 15px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.concept-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.concept-tab-btn {
  background: var(--panel2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 16px 20px;
  border-radius: 16px;
  font-weight: 700;
  text-align: right;
  transition: all 0.25s;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.concept-tab-btn span { font-size: 0.8rem; color: var(--muted); font-weight: 400; }
.concept-tab-btn:hover, .concept-tab-btn.active {
  border-color: var(--accent);
  background: rgba(99, 102, 241, 0.12);
  color: var(--accent);
  transform: translateY(-2px);
}
.concept-display-box {
  background: var(--panel2);
  border: 1px solid var(--accent);
  border-radius: 18px;
  padding: 25px;
  margin-top: 15px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
  animation: fadeIn 0.3s ease;
}
.concept-display-box h4 { color: var(--cyan); margin-top: 0; font-size: 1.25rem; font-weight: 800; }
.concept-display-box p { color: var(--muted); line-height: 1.8; margin-bottom: 12px; }
.math-block {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--cyan);
  font-family: monospace;
  font-size: 1.15rem;
  padding: 12px 18px;
  border-radius: 12px;
  text-align: center;
  margin: 12px 0;
  direction: ltr;
  font-weight: bold;
}

.q-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 18px; padding: 22px; margin-bottom: 20px; }
.q-title { font-weight: 800; font-size: 1.05rem; margin-bottom: 16px; }
.opts-grid { display: grid; gap: 10px; }
.opt-btn {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 14px 18px;
  border-radius: 12px;
  text-align: right;
  transition: all 0.2s;
}
.opt-btn:hover { border-color: var(--accent); background: rgba(99, 102, 241, 0.1); }
.opt-btn.selected { background: rgba(99, 102, 241, 0.25); border-color: var(--accent); font-weight: bold; }
.opt-btn.correct { background: rgba(16, 185, 129, 0.25); border-color: var(--success); color: #a7f3d0; font-weight: bold; }
.opt-btn.wrong { background: rgba(239, 68, 68, 0.25); border-color: var(--danger); color: #fecdd3; }

.submit-quiz-btn {
  display: block; width: 100%;
  background: linear-gradient(135deg, var(--accent), var(--cyan));
  color: #fff; border: none; padding: 16px; font-size: 1.2rem; font-weight: 900;
  border-radius: 16px; margin-top: 25px; cursor: pointer; box-shadow: var(--shadow);
}
.score-box {
  background: var(--panel2); border: 2px solid var(--cyan); border-radius: 16px;
  padding: 20px; text-align: center; font-size: 1.5rem; font-weight: 900; color: var(--cyan);
  margin-bottom: 25px; display: none;
}

.main-footer {
  background: var(--panel);
  border-top: 1px solid var(--border);
  padding: 50px 0;
  text-align: center;
  margin-top: 60px;
}
.telegram-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: #24A1DE;
  color: #fff;
  padding: 16px 32px;
  border-radius: 16px;
  font-size: 1.15rem;
  font-weight: 900;
  box-shadow: 0 10px 30px rgba(36, 161, 222, 0.4);
  transition: transform 0.2s, background 0.2s;
  margin: 20px 0;
}
.telegram-btn:hover { background: #1e8bc3; transform: scale(1.03); }

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 900px) {
  .nav-links { display: none; position: absolute; top: 85px; right: 20px; left: 20px; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 20px; flex-direction: column; }
  .nav-links.open { display: flex; }
  .mobile-btn { display: block; }
  .hero-wrapper { grid-template-columns: 1fr; padding-top: 30px; }
  .grid-cards { grid-template-columns: repeat(2, 1fr); }
  .pdf-viewer, .quiz-iframe { height: 70vh; min-height: 500px; }
}
@media (max-width: 600px) {
  .grid-cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body class="dark-mode">

themeToggle.addEventListener('click', () => {
  isDark = !isDark;

  themeToggle.textContent = isDark ? '☀️ نهاري' : '🌙 ليلي';

const testsList = [

const skillQuests = [
  [

    {q: "2- خالد يخطط لإجراء بحث حول الغش التجاري خلال أزمة كورونا، ما هو المصدر الأكثر موثوقية ؟", opts: ["التقرير السنوي لوزارة التجارة", "تقرير وزارة الصحة لكورونا", "ورقة بحثية عن سلوك المستهلك", "استبيانات دول أخرى"], ans: 0},

    {q: "5- المكان الأكثر دقة وموثوقية للبحث عن معلومة علمية عبر الإنترنت:", opts: ["مدونة شخصية", "ويكيبيديا الحرة", "ورقة علمية محكمة", "مواقع التواصل الاجتماعي"], ans: 2},
    {q: "6- من الحجج التي تدعم عدم موثوقية بعض مصادر الإنترنت:", opts: ["أنها سهلة الوصول", "اختلاط المعلومات العلمية بالدعائية والأخبارية", "أنها مجانية بالكامل", "تتحدث بصفة مستمرة"], ans: 1},
    {q: "7- المكان الأكثر موثوقية للبحث عن أضرار القهوة:", opts: ["موقع عشاق القهوة", "الهيئة العامة للغذاء والدواء", "موقع نصائح يومية منوع", "مقالات شركات القهوة"], ans: 1},
    {q: "8- ضخامة محتوى الإنترنت حالياً تستوجب بالضرورة:", opts: ["العودة الكاملة للكتب الورقية", "إيقاف البحث التقني", "إضافة معايير تقويم وتصفية للمعلومات", "الاعتماد على منصات التواصل"], ans: 2},

    {q: "19- لحساب الدرجة المتوسطة لاختبارين في الخلية N11 و N12 ببرنامج Excel:", opts: ["(N11+N12)/2", "N11+N12/2", "$N11+N12/2", "(N11-N12)/2"], ans: 0},
    {q: "20- التطبيق الأنسب لحساب المصاريف بدون آلة حاسبة:", opts: ["Word", "Excel", "PowerPoint", "Notepad"], ans: 1},

function switchConcept(type, index) {
  let tabsContainer, displayBox, dataObj;
  if(type === 'chem') { tabsContainer = document.getElementById('chemTabs'); displayBox = document.getElementById('chemDisplay'); dataObj = chemConcepts; }
  else if(type === 'pulley') { tabsContainer = document.getElementById('pulleyTabs'); displayBox = document.getElementById('pulleyDisplay'); dataObj = pulleyConcepts; }
  else if(type === 'names') { tabsContainer = document.getElementById('namesTabs'); displayBox = document.getElementById('namesDisplay'); dataObj = summaryConceptData.names; }
  else if(type === 'hydro') { tabsContainer = document.getElementById('hydroTabs'); displayBox = document.getElementById('hydroDisplay'); dataObj = summaryConceptData.hydro; }

  tabsContainer.querySelectorAll('.concept-tab-btn').forEach((btn, idx) => {
    btn.classList.toggle('active', idx === index);
  });

  let data = dataObj[index];
  displayBox.innerHTML = `
    <h4>${data.title}</h4>
    <p>${data.desc}</p>
    <div class="math-block">${data.math}</div>
    <p><b>${data.example}</b></p>
  `;
}

      <p>للاطلاع على التجميعات الورقية والواجبات:</p>
      <a class="action-btn primary" href="تجميع%20المهارات%20محمد%20تحصيلي.pdf" target="_blank" rel="noopener">فتح أو تحميل ملف التجميع الأصلي ↗</a>
    </div>
  `;
}

let skAnswers = {};
function renderSkillQuiz(qIdx) {
  let items = skillQuests[qIdx];
  let html = `
    <div class="main-panel" style="border: 2px solid var(--accent);">
      <h2>اختبار المهارات ${qIdx+1} — تفاعلي مباشر</h2>
      <div id="skScoreBox" class="score-box"></div>
  `;
  items.forEach((item, idx) => {
    html += `
      <div class="q-card" id="skq-${qIdx}-${idx}">
        <div class="q-title">${item.q}</div>
        <div class="opts-grid">
    `;
    item.opts.forEach((opt, oIdx) => {
      html += `<button class="opt-btn" onclick="selectSkOpt(${qIdx}, ${idx}, ${oIdx}, this)">${opt}</button>`;
    });
    html += `</div></div>`;
  });
  html += `<button class="submit-quiz-btn" onclick="checkSkQuiz(${qIdx})">تصحيح الاختبار وعرض النتيجة النهائية</button></div>`;
  
  document.getElementById('skQuizHost').innerHTML = html;
  window.scrollTo({ top: document.getElementById('skQuizHost').offsetTop - 60, behavior: 'smooth' });
}

function selectSkOpt(qIdx, itemIdx, optIdx, btn) {
  if (!skAnswers[qIdx]) skAnswers[qIdx] = {};
  skAnswers[qIdx][itemIdx] = optIdx;
  let parent = btn.parentElement;
  parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function checkSkQuiz(qIdx) {
  let items = skillQuests[qIdx];
  let score = 0;
  items.forEach((item, idx) => {
    let card = document.getElementById(`skq-${qIdx}-${idx}`);
    let opts = card.querySelectorAll('.opt-btn');
    let uAns = skAnswers[qIdx] ? skAnswers[qIdx][idx] : undefined;
    opts.forEach((btn, oIdx) => {
      btn.onclick = null;
      if (oIdx === item.ans) btn.classList.add('correct');
      else if (oIdx === uAns) btn.classList.add('wrong');
    });
    if (uAns === item.ans) score++;
  });
  let sb = document.getElementById('skScoreBox');
  sb.style.display = 'block';
  sb.innerHTML = `نتيجة اختبار المهارات ${qIdx+1}: ${score} من ${items.length} (${Math.round((score/items.length)*100)}%)`;
}

function renderRouter() {
  let hash = location.hash.replace('#', '') || 'home';
  let html = '';

  if (hash.startsWith('quiz-')) {
    let idx = Number(hash.split('-')[1]);
    html = renderTests() + renderQuizViewer(idx);
  } else if (hash === 'combined') {
    html = renderCombined();
  } else if (hash === 'home') {
    html = renderHome();
  } else if (hash === 'tests') {
    html = renderTests();
  } else if (hash === 'laws') {
    html = renderLaws();
  } else if (hash === 'linking') {
    html = renderLinking();
  } else if (hash === 'summaries') {
    html = renderSummaries();
  } else if (hash === 'skills') {
    html = renderSkills();
  } else {
    html = renderHome();
  }

  appContainer.innerHTML = html;
  navLinks.classList.remove('open');

  navLinks.querySelectorAll('[data-page]').forEach(b => {
    b.classList.toggle('active', b.dataset.page === hash);
    b.onclick = () => location.hash = b.dataset.page;
  });

  document.querySelectorAll('[data-page]').forEach(el => {
    el.onclick = () => location.hash = el.dataset.page;
  });

  document.querySelectorAll('[data-openquiz]').forEach(el => {
    el.onclick = () => location.hash = 'quiz-' + el.dataset.openquiz;
  });

  document.querySelectorAll('[data-skquIdx]').forEach(el => {
    el.onclick = () => renderSkillQuiz(Number(el.dataset.skquidx));
  });

  if (!hash.startsWith('quiz-')) window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('hashchange', renderRouter);
renderRouter();
</script>
</body>
</html>
