<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<title>KFUPMYNL | مرجعك الأكاديمي المتكامل</title>
<style>
:root {
  --bg-dark: #070913;
  --card-dark: rgba(18, 24, 43, 0.85);
  --card2-dark: #111827;
  --text-dark: #f3f4f6;
  --muted-dark: #9ca3af;
  --border-dark: rgba(255, 255, 255, 0.08);

  --bg-light: #f4f6f9;
  --card-light: rgba(255, 255, 255, 0.95);
  --card2-light: #ffffff;
  --text-light: #111827;
  --muted-light: #4b5563;
  --border-light: rgba(0, 0, 0, 0.08);

  --primary: #8b5cf6;
  --secondary: #ec4899;
  --neon: #06b6d4;
  --success: #10b981;
  --danger: #ef4444;
  --shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
}

body.dark-mode {
  --bg: var(--bg-dark);
  --card: var(--card-dark);
  --card2: var(--card2-dark);
  --text: var(--text-dark);
  --muted: var(--muted-dark);
  --border: var(--border-dark);
}

body.light-mode {
  --bg: var(--bg-light);
  --card: var(--card-light);
  --card2: var(--card2-light);
  --text: var(--text-light);
  --muted: var(--muted-light);
  --border: var(--border-light);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  line-height: 1.7;
  min-height: 100vh;
  transition: background 0.3s ease, color 0.3s ease;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
.container { max-width: 1200px; margin: auto; padding: 0 20px; }

/* تصميم الهيدر الجديد كلياً */
.header-wrap {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--card);
  backdrop-filter: blur(15px);
  border-bottom: 1px solid var(--border);
}
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 90px;
}
.brand-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  direction: ltr;
  font-weight: 900;
  font-size: 1.5rem;
  background: linear-gradient(135deg, var(--primary), var(--neon));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.logo-badge {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #fff;
  display: grid;
  place-items: center;
  border-radius: 12px;
  font-weight: bold;
  box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
}
.nav-menu {
  display: flex;
  gap: 6px;
}
.nav-menu button {
  background: transparent;
  color: var(--muted);
  border: none;
  padding: 10px 18px;
  border-radius: 12px;
  font-weight: 700;
  transition: all 0.3s;
}
.nav-menu button:hover, .nav-menu button.active {
  background: rgba(139, 92, 246, 0.15);
  color: var(--primary);
}
.top-controls {
  display: flex;
  gap: 12px;
}
.control-btn {
  background: var(--card2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}
.mobile-toggle { display: none; background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 10px; }

/* الواجهة الرئيسية الجديدة (Hero) */
.hero-section {
  padding: 70px 0 50px;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  align-items: center;
  gap: 40px;
}
.hero-tag {
  display: inline-block;
  background: rgba(236, 72, 153, 0.12);
  color: var(--secondary);
  border: 1px solid rgba(236, 72, 153, 0.3);
  padding: 6px 16px;
  border-radius: 50px;
  font-size: 0.9rem;
  font-weight: 800;
  margin-bottom: 20px;
}
.hero-title {
  font-size: clamp(2.5rem, 4.5vw, 4.2rem);
  line-height: 1.15;
  font-weight: 900;
  margin: 0 0 20px;
}
.hero-title span {
  background: linear-gradient(120deg, var(--secondary), var(--primary), var(--neon));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero-desc {
  font-size: 1.15rem;
  color: var(--muted);
  margin-bottom: 30px;
  max-width: 580px;
}
.hero-buttons {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
}
.main-btn {
  padding: 14px 28px;
  border-radius: 14px;
  font-weight: 800;
  border: none;
  transition: transform 0.2s, box-shadow 0.2s;
}
.main-btn:hover { transform: translateY(-3px); }
.main-btn.primary {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #fff;
  box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
}
.main-btn.outline {
  background: var(--card2);
  color: var(--text);
  border: 1px solid var(--border);
}

.hero-visual {
  background: linear-gradient(145deg, rgba(139, 92, 246, 0.1), rgba(6, 182, 212, 0.05));
  border: 1px solid var(--border);
  border-radius: 30px;
  padding: 40px;
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.hero-visual h3 { font-size: 1.8rem; margin: 0 0 10px; font-weight: 900; }
.hero-visual p { color: var(--muted); margin: 0; }

/* بطاقات الأقسام بتصميم جديد كلياً */
.sections-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  padding: 40px 0 70px;
}
.section-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 30px;
  position: relative;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  overflow: hidden;
}
.section-card::before {
  content: "";
  position: absolute;
  top: 0; right: 0; left: 0; height: 4px;
  background: linear-gradient(90deg, var(--primary), var(--neon));
  opacity: 0;
  transition: opacity 0.3s;
}
.section-card:hover {
  transform: translateY(-8px);
  border-color: var(--primary);
  box-shadow: var(--shadow);
}
.section-card:hover::before { opacity: 1; }
.card-icon {
  width: 60px; height: 60px;
  background: rgba(139, 92, 246, 0.12);
  color: var(--primary);
  border-radius: 18px;
  display: grid;
  place-items: center;
  font-size: 1.8rem;
  margin-bottom: 20px;
}
.section-card h3 { font-size: 1.4rem; margin: 0 0 10px; font-weight: 800; }
.section-card p { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
.card-link { color: var(--primary); font-weight: 800; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 5px; }

/* عرض المحتوى والصفحات الفرعية */
.back-btn { background: transparent; border: none; color: var(--primary); font-weight: 800; font-size: 1.1rem; padding: 10px 0; margin-bottom: 20px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.page-header { margin-bottom: 30px; }
.page-header h1 { font-size: 2.5rem; font-weight: 900; margin: 5px 0 10px; }
.page-header p { color: var(--muted); font-size: 1.1rem; max-width: 700px; }

.content-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 35px;
  margin-bottom: 30px;
  box-shadow: var(--shadow);
}
.download-box {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px 25px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 25px;
  flex-wrap: wrap;
}
.download-box h4 { margin: 0 0 4px; font-size: 1.2rem; }
.download-box p { margin: 0; color: var(--muted); font-size: 0.92rem; }

.viewer-frame, .quiz-frame {
  width: 100%;
  height: 85vh;
  min-height: 750px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: #fff;
}
.quiz-frame { background: #0b0f19; }

/* عناصر الشرح التفصيلي الجديدة المطلوبة */
.explanation-box {
  background: var(--card2);
  border-right: 5px solid var(--secondary);
  border-radius: 16px;
  padding: 24px;
  margin-top: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}
.explanation-box h4 { color: var(--secondary); margin-top: 0; font-size: 1.25rem; }
.explanation-box p { color: var(--muted); line-height: 1.8; margin-bottom: 12px; }
.formula-display {
  background: var(--bg);
  border: 1px solid var(--primary);
  color: var(--neon);
  font-family: monospace;
  font-size: 1.2rem;
  padding: 12px 20px;
  border-radius: 10px;
  text-align: center;
  margin: 12px 0;
  direction: ltr;
}

/* اختبارات المهارات */
.quiz-card { background: var(--card2); border: 1px solid var(--border); border-radius: 18px; padding: 22px; margin-bottom: 20px; }
.quiz-question { font-weight: 800; font-size: 1.1rem; margin-bottom: 16px; }
.options-grid { display: grid; gap: 10px; }
.option-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 14px 18px;
  border-radius: 12px;
  text-align: right;
  transition: all 0.2s;
  font-size: 0.98rem;
}
.option-btn:hover { border-color: var(--primary); background: rgba(139, 92, 246, 0.1); }
.option-btn.selected { background: rgba(139, 92, 246, 0.25); border-color: var(--primary); font-weight: bold; }
.option-btn.correct { background: rgba(16, 185, 129, 0.25); border-color: var(--success); color: #a7f3d0; font-weight: bold; }
.option-btn.wrong { background: rgba(239, 68, 68, 0.25); border-color: var(--danger); color: #fecdd3; }

.submit-quiz-btn {
  display: block; width: 100%;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #fff; border: none; padding: 16px; font-size: 1.2rem; font-weight: 900;
  border-radius: 16px; margin-top: 25px; cursor: pointer; box-shadow: var(--shadow);
}
.score-result-box {
  background: var(--card2); border: 2px solid var(--neon); border-radius: 16px;
  padding: 20px; text-align: center; font-size: 1.5rem; font-weight: 900; color: var(--neon);
  margin-bottom: 25px; display: none;
}

/* الفوتر وتليجرام */
.main-footer {
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 50px 0;
  text-align: center;
  margin-top: 60px;
}
.telegram-main-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: #24A1DE;
  color: #fff;
  padding: 16px 32px;
  border-radius: 16px;
  font-size: 1.1rem;
  font-weight: 900;
  box-shadow: 0 10px 30px rgba(36, 161, 222, 0.4);
  transition: transform 0.2s, background 0.2s;
  margin: 20px 0;
}
.telegram-main-btn:hover { background: #1e8bc3; transform: scale(1.03); }

@media (max-width: 900px) {
  .nav-menu { display: none; position: absolute; top: 90px; right: 20px; left: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; flex-direction: column; }
  .nav-menu.open { display: flex; }
  .mobile-toggle { display: block; }
  .hero-section { grid-template-columns: 1fr; padding-top: 40px; }
  .sections-grid { grid-template-columns: repeat(2, 1fr); }
  .viewer-frame, .quiz-frame { height: 70vh; min-height: 500px; }
}
@media (max-width: 600px) {
  .sections-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body class="dark-mode">

<div class="header-wrap">
  <div class="container navbar">
    <a class="brand-logo" href="#home">
      <div class="logo-badge">K</div>
      <span>KFUPMYNL</span>

<footer class="main-footer">

      <a class="telegram-main-btn" href="https://t.me/KFUPMYNL" target="_blank" rel="noopener">

      </a>
    </div>
    <small style="color: var(--muted); font-size: 0.9rem;">KFUPMYNL · المنصة الأكاديمية المتكاملة</small>
  </div>
</footer>

<script>
const appContainer = document.getElementById('appContainer');
const navMenu = document.getElementById('navMenu');
const themeToggle = document.getElementById('themeToggle');
const menuToggle = document.getElementById('menuToggle');

// نظام الوضع النهاري والليلي
let isDark = true;
themeToggle.addEventListener('click', () => {
  isDark = !isDark;
  document.body.className = isDark ? 'dark-mode' : 'light-mode';
  themeToggle.textContent = isDark ? '☀️ نهاري' : '🌙 ليلي';
});

menuToggle.addEventListener('click', () => navMenu.classList.toggle('open'));

const pageTitles = {
  home: 'الرئيسية',
  tests: 'الاختبارات',
  laws: 'القوانين',
  linking: 'الربط',
  summaries: 'الملخصات',
  skills: 'المهارات'
};

const testsList = [
  {title: 'اختبار 1', desc: 'ملف الاختبار الأصلي الأول', url: 'test-1.html', icon: '①'},
  {title: 'اختبار 2', desc: 'ملف الاختبار الأصلي الثاني', url: 'test-2.html', icon: '②'},
  {title: 'اختبار 3', desc: 'ملف الاختبار الأصلي الثالث', url: 'test-3.html', icon: '③'}
];

// بيانات أسئلة المهارات الـ 85 (5 اختبارات)
const skillQuests = [
  [
    {q: "1- أي من المصادر التالية يعتبر الأكثر موضوعية ودقة عند البحث عن العلاقة بين السمنة والمشروبات الغازية ؟", opts: ["استبيانات شركات المشروبات", "دورية علمية محكمة في التغذية", "دراسة متطوعين غير متخصصين", "تقرير وزارة النقل"], ans: 1},
    {q: "2- خالد يخطط لإجراء بحث حول الغش التجاري خلال أزمة كورونا، ما هو المصدر الأكثر موثوقية ؟", opts: ["التقرير السنوي لوزارة التجارة", "تقرير وزارة الصحة لكورونا", "ورقة بحثية عن سلوك المستهلك", "استبيانات دول أخرى"], ans: 0},
    {q: "3- إذا أردت البحث عن فوائد الشاي باستثناء الشاي الأخضر، ماذا تكتب في محرك البحث ؟", opts: ["فوائد الشاي \"الأخضر\"", "فوائد الشاي : الأخضر", "فوائد الشاي - الأخضر", "فوائد الشاي"], ans: 2},
    {q: "4- طلب من خبير البحث عن العوامل المؤثرة في كفاءة الموظفين، ما الأسلوب المناسب لجمع البيانات ؟", opts: ["البحث في الإنترنت عن تقارير مشابهة", "دراسة مسحية باستبيان للموظفين", "دعوة خبراء للشركة وسؤالهم", "توزيع مكافآت مالية"], ans: 1},
    {q: "5- المكان الأكثر دقة وموثوقية للبحث عن معلومة علمية عبر الإنترنت:", opts: ["مدونة شخصية", "ويكيبيديا الحرة", "ورقة علمية محكمة", "مواقع التواصل الاجتماعي"], ans: 2},
    {q: "6- من الحجج التي تدعم عدم موثوقية بعض مصادر الإنترنت:", opts: ["أنها سهلة الوصول", "اختلاط المعلومات العلمية بالدعائية والأخبارية", "أنها مجانية بالكامل", "تتحدث بصفة مستمرة"], ans: 1},
    {q: "7- المكان الأكثر موثوقية للبحث عن أضرار القهوة:", opts: ["موقع عشاق القهوة", "الهيئة العامة للغذاء والدواء", "موقع نصائح يومية منوع", "مقالات شركات القهوة"], ans: 1},
    {q: "8- ضخامة محتوى الإنترنت حالياً تستوجب بالضرورة:", opts: ["العودة الكاملة للكتب الورقية", "إيقاف البحث التقني", "إضافة معايير تقويم وتصفية للمعلومات", "الاعتماد على منصات التواصل"], ans: 2},
    {q: "9- عملية ترتيب الباحث للمصادر العلمية في مجلدات لتسهيل الرجوع لها تسمى:", opts: ["تصنيف", "استنباط", "مقارنة", "استقراء"], ans: 0},
    {q: "10- الروابط الإلكترونية التي تنتهي بـ gov تتبع لجهات:", opts: ["حكومية", "تعليمية", "تجارية", "غير ربحية"], ans: 0},
    {q: "11- أراد فهد توقع فترة انتهاء كورونا عالمياً، ما هو المصدر الأنسب للإعتماد عليه ؟", opts: ["معدلات الوفيات من وزارة الصحة السعودية", "مجلة اقتصادية عالمية", "تقارير رسمية دولية عن الإصابات ودورة الفيروس", "استبيانات أشخاص معنيين"], ans: 2},
    {q: "12- إذا كانت نتائج ورقة بحثية لا تتطابق مع نتائجك، فما هو التصرف السليم ؟", opts: ["الاستشهاد بها على كل حال", "تجاهلها والبحث عن مصدر آخر", "الاستشهاد بها بلا مصدر", "اختلاق نتائج جديدة"], ans: 1},
    {q: "13- الرمز C على المنتجات يدل على:", opts: ["شعار الشركة المصنعة", "حقوق النشر (Copyrights)", "رخصة تشغيل دولية", "علامة تجارية مسجلة"], ans: 1},
    {q: "14- توقعات بأن النفط سيقل وسيتلاشى تدريجياً، تُعتبر هذه العبارة بمثابة ...", opts: ["إشاعة", "خبر كاذب", "حقيقة علمية مطلقة", "رأي أو توقع احتمالي"], ans: 3},
    {q: "15- ضخامة المعلومات المغلوطة بالإنترنت توجب:", opts: ["إلغاء الاعتماد على التقنية", "توظيف باحثين فقط", "إضافة معايير لتقويم وتقييم المعلومات وتصنيفها", "الاعتماد على المكتبات التقليدية"], ans: 2},
    {q: "16- الدالة المستخدمة في Excel لحساب رواتب الموظفين بعد الشروط والخصومات:", opts: ["COUNT", "SQL.P", "IF", "SUM"], ans: 2},
    {q: "17- الأسلوب الأنسب لتمثيل مجموع المدفوعات الشهرية ونسبة كل منها هو:", opts: ["رسم بياني بالأعمدة", "رسم خطي زمني", "رسم دائري نسبوي", "جدول نصي بسيط"], ans: 2}
  ],
  [
    {q: "18- اختصار لوحة المفاتيح لتغيير لغة الكتابة في النظام هو:", opts: ["Ctrl + Shift", "Alt + Shift", "Win + Alt", "Ctrl + Alt"], ans: 1},
    {q: "19- لحساب الدرجة المتوسطة لاختبارين في الخلية N11 و N12 ببرنامج Excel:", opts: ["(N11+N12)/2", "N11+N12/2", "$N11+N12/2", "(N11-N12)/2"], ans: 0},
    {q: "20- التطبيق الأنسب لحساب المصاريف بدون آلة حاسبة:", opts: ["Word", "Excel", "PowerPoint", "Notepad"], ans: 1},

    <div class="content-panel">
      <h2>⚖️ قسم الحسابات الكيميائية (Stoichiometry)</h2>
      <p>الحسابات الكيميائية تهتم بدراسة العلاقات الكمية بين المتفاعلات والنواتج في التفاعلات الكيميائية بناءً على قانون حفظ المادة.</p>
      
      <div class="explanation-box">
        <h4>1. حساب عدد المولات (Number of Moles)</h4>
        <p>عدد المولات يُحسب بقسمة كتلة المادة بالجرام (كتلة المادة w) على الكتلة المولية للمادة (MM):</p>
        <div class="formula-display">عدد المولات (n) = كتلة المادة (w) ÷ الكتلة المولية (MM)</div>
        <p><b>مثال بسيط:</b> ما عدد المولات الموجودة في 40 جرام من هيدروكسيد الصوديوم NaOH (علماً بأن الكتلة المولية له = 40 g/mol)؟<br>
        <b>الحل:</b> n = 40 ÷ 40 = 1 مول فقط.</p>
      </div>

      <div class="explanation-box">
        <h4>2. حساب النسبة المئوية بالكتلة للعنصر</h4>
        <p>تستخدم لمعرفة نسبة عنصر معين داخل المركب الكيميائي:</p>
        <div class="formula-display">نسبة العنصر (%) = (كتلة العنصر في المركب ÷ الكتلة المولية للمركب) × 100</div>
        <p><b>مثال بسيط:</b> حساب نسبة الأكسجين في ماء الهيدروجين H₂O (كتلة الهيدروجين 2 والأكسجين 16، الكتلة الكلية 18).<br>
        <b>الحل:</b> (16 ÷ 18) × 100 = 88.9% تقريباً.</p>

}

// تشغيل اختبارات المهارات التفاعلية
let skAnswers = {};
function renderSkillQuiz(qIdx) {
  let items = skillQuests[qIdx];
  let html = `
    <div class="content-panel" style="border: 2px solid var(--primary);">
      <h2>اختبار المهارات ${qIdx+1} — تفاعلي مباشر</h2>
      <div id="skScoreBox" class="score-result-box"></div>
  `;
  items.forEach((item, idx) => {
    html += `
      <div class="quiz-card" id="skq-${qIdx}-${idx}">
        <div class="quiz-question">${item.q}</div>
        <div class="options-grid">
    `;
    item.opts.forEach((opt, oIdx) => {
      html += `<button class="option-btn" onclick="selectSkOpt(${qIdx}, ${idx}, ${oIdx}, this)">${opt}</button>`;
    });
    html += `</div></div>`;
  });
  html += `<button class="submit-quiz-btn" onclick="checkSkQuiz(${qIdx})">تصحيح الاختبار وعرض النتيجة النهائية</button></div>`;
  
  document.getElementById('skQuizHost').innerHTML = html;
  window.scrollTo({ top: document.getElementById('skQuizHost').offsetTop - 60, behavior: 'smooth' });
}

function selectSkOpt(qIdx, itemIdx, optIdx, btn) {
  if (!skAnswers[qIdx]) skAnswers[qIdx] = {};
  skAnswers[qIdx][itemIdx] = optIdx;
  let parent = btn.parentElement;
  parent.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function checkSkQuiz(qIdx) {
  let items = skillQuests[qIdx];
  let score = 0;
  items.forEach((item, idx) => {
    let card = document.getElementById(`skq-${qIdx}-${idx}`);
    let opts = card.querySelectorAll('.option-btn');
    let uAns = skAnswers[qIdx] ? skAnswers[qIdx][idx] : undefined;
    opts.forEach((btn, oIdx) => {
      btn.onclick = null;
      if (oIdx === item.ans) btn.classList.add('correct');
      else if (oIdx === uAns) btn.classList.add('wrong');
    });
    if (uAns === item.ans) score++;
  });
  let sb = document.getElementById('skScoreBox');
  sb.style.display = 'block';
  sb.innerHTML = `نتيجة اختبار المهارات ${qIdx+1}: ${score} من ${items.length} (${Math.round((score/items.length)*100)}%)`;
}

// الموجه المركزي للتنقل
function renderRouter() {
  let hash = location.hash.replace('#', '') || 'home';
  let html = '';

  if (hash.startsWith('quiz-')) {
    let idx = Number(hash.split('-')[1]);
    html = renderTests() + renderQuizViewer(idx);
  } else if (hash === 'combined') {
    html = renderCombined();
  } else if (hash === 'home') {
    html = renderHome();
  } else if (hash === 'tests') {
    html = renderTests();
  } else if (hash === 'laws') {
    html = renderLaws();
  } else if (hash === 'linking') {
    html = renderLinking();
  } else if (hash === 'summaries') {
    html = renderSummaries();
  } else if (hash === 'skills') {
    html = renderSkills();
  } else {
    html = renderHome();
  }

  appContainer.innerHTML = html;
  navMenu.classList.remove('open');

  // ربط الأزرار والمستندات
  navMenu.querySelectorAll('[data-page]').forEach(b => {
    b.classList.toggle('active', b.dataset.page === hash);
    b.onclick = () => location.hash = b.dataset.page;
  });

  document.querySelectorAll('[data-page]').forEach(el => {
    if(!el.tagName || el.tagName !== 'BUTTON') {
      el.onclick = () => location.hash = el.dataset.page;
    } else {
      el.onclick = () => location.hash = el.dataset.page;
    }
  });

  document.querySelectorAll('[data-openquiz]').forEach(el => {
    el.onclick = () => location.hash = 'quiz-' + el.dataset.openquiz;
  });

  document.querySelectorAll('[data-skquIdx]').forEach(el => {
    el.onclick = () => renderSkillQuiz(Number(el.dataset.skquidx));
  });

  if (!hash.startsWith('quiz-')) window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('hashchange', renderRouter);
renderRouter();
